  <path d="M148 214L210 232L272 214V294L210 312L148 294V214Z" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round" />
  <path d="M210 232V312" stroke="#065F46" stroke-width="3" />
