<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-labelledby="tahfidz-title tahfidz-desc">
  <title id="tahfidz-title">Area Kegiatan Tahfidz, Wisuda &amp; Ekstrakurikuler YPI Al-Fuad</title>
  <desc id="tahfidz-desc">Ilustrasi halaqah setoran hafalan Al-Qur'an, wisuda tahfidz, dan kegiatan pengembangan bakat santri di Poris Gaga.</desc>
  <defs>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#areaGrad)" />

  <!-- Decorative Arch Panels -->
  <path d="M84 440V180C84 110 142 66 210 66C278 66 336 110 336 180V440H84Z" fill="#065F46" />
  <path d="M104 440V186C104 128 152 90 210 90C268 90 316 128 316 186V440H104Z" fill="#064E3B" stroke="#F59E0B" stroke-width="2.5" />

