<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-labelledby="lab-title lab-desc">
  <title id="lab-title">Laboratorium Komputer &amp; Praktik Kejuruan SMK-IT Al-Fuad</title>
  <desc id="lab-desc">Ilustrasi laboratorium komputer modern di SMK-IT dan SMP-IT Al-Fuad untuk pembekalan literasi digital dan kejuruan.</desc>
  <rect width="800" height="500" fill="#0F172A" />
