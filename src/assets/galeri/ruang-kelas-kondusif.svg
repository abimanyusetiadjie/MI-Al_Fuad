<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-labelledby="kelas-title kelas-desc">
  <title id="kelas-title">Ruang Kelas Kondusif YPI Al-Fuad</title>
  <desc id="kelas-desc">Ilustrasi ruang kelas yang rapi, terang, dan kondusif dengan papan tulis serta meja belajar santri.</desc>
  <rect width="800" height="500" fill="#FAF8F5" />
  <rect x="0" y="370" width="800" height="130" fill="#F3EFEA" />

  <!-- Classroom Windows -->
  <rect x="52" y="54" width="126" height="180" rx="12" fill="#ECFDF5" stroke="#047857" stroke-width="4" />
  <line x1="115" y1="54" x2="115" y2="234" stroke="#047857" stroke-width="3" />
  <line x1="52" y1="144" x2="178" y2="144" stroke="#047857" stroke-width="3" />

  <!-- Whiteboard -->
  <rect x="220" y="64" width="480" height="200" rx="14" fill="#FFFFFF" stroke="#065F46" stroke-width="6" />
  <rect x="248" y="96" width="190" height="14" rx="7" fill="#065F46" fill-opacity="0.8" />
  <rect x="248" y="124" width="320" height="10" rx="5" fill="#475569" fill-opacity="0.35" />
  <rect x="248" y="148" width="270" height="10" rx="5" fill="#475569" fill-opacity="0.35" />
  <!-- Golden Arabic/Tahfidz highlight box on board -->
  <rect x="248" y="178" width="220" height="54" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
  <text x="358" y="210" text-anchor="middle" fill="#064E3B" font-family="Arial, sans-serif" font-size="16" font-weight="700">
    JUZ 30 + TERJEMAH AYAT
  </text>
  <!-- Clock on wall -->
  <circle cx="640" cy="126" r="34" fill="#ECFDF5" stroke="#D97706" stroke-width="3" />
  <path d="M640 106V126L654 134" stroke="#064E3B" stroke-width="3.5" stroke-linecap="round" />

  <!-- Desks & Chairs -->
  <g transform="translate(150, 294)">
    <rect x="0" y="34" width="144" height="16" rx="6" fill="#D97706" />
    <rect x="16" y="50" width="10" height="62" fill="#064E3B" />
    <rect x="118" y="50" width="10" height="62" fill="#064E3B" />
    <rect x="34" y="12" width="42" height="22" rx="4" fill="#FFFFFF" stroke="#047857" stroke-width="2" />
  </g>
  <g transform="translate(340, 294)">
    <rect x="0" y="34" width="144" height="16" rx="6" fill="#D97706" />
    <rect x="16" y="50" width="10" height="62" fill="#064E3B" />
    <rect x="118" y="50" width="10" height="62" fill="#064E3B" />
    <rect x="46" y="12" width="42" height="22" rx="4" fill="#FFFFFF" stroke="#047857" stroke-width="2" />
  </g>
  <g transform="translate(530, 294)">
    <rect x="0" y="34" width="144" height="16" rx="6" fill="#D97706" />
    <rect x="16" y="50" width="10" height="62" fill="#064E3B" />
    <rect x="118" y="50" width="10" height="62" fill="#064E3B" />
    <rect x="40" y="12" width="42" height="22" rx="4" fill="#FFFFFF" stroke="#047857" stroke-width="2" />
  </g>
</svg>
