<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" fill="none" role="img" aria-labelledby="hero-art-title hero-art-desc">
  <title id="hero-art-title">Ilustrasi Wisuda Tahfidz Al-Qur'an YPI Al-Fuad Poris Gaga</title>
  <desc id="hero-art-desc">Komposisi visual arsitektur masjid, mushaf Al-Qur'an terbuka, dan santri putra serta putri berbusana Muslim sopan dengan selempang wisuda tahfidz di bawah naungan YPI Al-Fuad sejak 1990.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="640" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="55%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#04392B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="160" y1="90" x2="480" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="creamArch" x1="320" y1="84" x2="320" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F5" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#F3EFEA" stop-opacity="0.94" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="720" rx="28" fill="url(#bgGrad)" />
  <rect width="640" height="720" rx="28" fill="url(#haloGrad)" />

  <!-- Subtle Islamic 8-point star geometry top corners -->
  <g stroke="#F59E0B" stroke-opacity="0.16" stroke-width="1.5">
    <rect x="44" y="44" width="64" height="64" transform="rotate(45 76 76)" />
    <rect x="44" y="44" width="64" height="64" />
    <rect x="532" y="44" width="64" height="64" transform="rotate(45 564 76)" />
    <rect x="532" y="44" width="64" height="64" />
  </g>

  <!-- Outer Golden Mihrab Frame -->
  <path
    d="M110 640V300C110 185 205 100 320 62C435 100 530 185 530 300V640H110Z"
    stroke="url(#goldGrad)"
    stroke-width="3"
    fill="#04392B"
    fill-opacity="0.45"
  />

  <!-- Inner Cream Mihrab Arch -->
  <path
    d="M132 622V304C132 204 218 128 320 94C422 128 508 204 508 304V622H132Z"
    fill="url(#creamArch)"
  />

  <!-- Mosque At-Taqwa Silhouette Inside Upper Arch -->
  <g transform="translate(0, 8)">
    <!-- Dome & Crescent -->
    <path
      d="M244 265C244 220 278 186 320 170C362 186 396 220 396 265H244Z"
      fill="#065F46"
      fill-opacity="0.16"
    />
    <path
      d="M320 144V170"
      stroke="#D97706"
      stroke-width="3"
      stroke-linecap="round"
    />
    <path
      d="M324 134C317 134 313 139 313 145C313 151 317 156 324 156C320 154 318 150 318 145C318 140 320 136 324 134Z"
      fill="#D97706"
    />
    <!-- Side arches -->
    <path
      d="M185 275H455"
      stroke="#065F46"
      stroke-opacity="0.2"
      stroke-width="2"
    />
  </g>

  <!-- Santri Putri (Left - Hijab Syar'i & Selempang Tahfidz) -->
  <g transform="translate(178, 286)">
    <!-- Body / Robe -->
    <path
      d="M22 252L38 118C41 95 58 82 82 82C106 82 123 95 126 118L142 252H22Z"
      fill="#065F46"
    />
    <!-- Hijab Syar'i -->
    <path
      d="M44 74C44 42 62 24 82 24C102 24 120 42 120 74V132C106 146 58 146 44 132V74Z"
      fill="#ECFDF5"
      stroke="#047857"
      stroke-width="2.5"
    />
    <!-- Face Silhouette (Warm neutral) -->
    <circle cx="82" cy="68" r="21" fill="#FDE6C4" />
    <!-- Hijab Inner Frame -->
    <path
      d="M59 68C59 50 70 40 82 40C94 40 105 50 105 68"
      stroke="#064E3B"
      stroke-width="3"
      stroke-linecap="round"
    />
    <!-- Selempang Wisuda Tahfidz (Gold Sash) -->
    <path
      d="M104 94L52 228H72L118 106L104 94Z"
      fill="url(#goldGrad)"
    />
    <!-- Open Mushaf Held -->
    <path
      d="M46 156L82 166L118 156V198L82 208L46 198V156Z"
      fill="#FFFFFF"
      stroke="#D97706"
      stroke-width="2.2"
      stroke-linejoin="round"
    />
    <path d="M82 166V208" stroke="#065F46" stroke-width="2" />
  </g>

  <!-- Santri Putra (Right - Peci & Baju Koko & Selempang Tahfidz) -->
  <g transform="translate(306, 276)">
    <!-- Body / Baju Koko -->
    <path
      d="M24 262L38 126C41 102 60 88 86 88C112 88 131 102 134 126L148 262H24Z"
      fill="#047857"
    />
    <!-- Koko Collar -->
    <path
      d="M70 88L86 112L102 88"
      stroke="#ECFDF5"
      stroke-width="3"
      fill="none"
    />
    <!-- Head & Neck -->
    <rect x="77" y="76" width="18" height="16" rx="6" fill="#F3D2A6" />
    <circle cx="86" cy="62" r="22" fill="#FDE6C4" />
    <!-- Peci Hitam Nasional -->
    <path
      d="M62 52C62 35 72 28 86 28C100 28 110 35 110 52H62Z"
      fill="#0F172A"
    />
    <path d="M63 50H109" stroke="#F59E0B" stroke-width="2" />
    <!-- Selempang Wisuda Tahfidz (Gold Sash) -->
    <path
      d="M60 98L116 238H96L46 110L60 98Z"
      fill="url(#goldGrad)"
    />
    <!-- Open Mushaf Held -->
    <path
      d="M48 164L86 174L124 164V206L86 216L48 206V164Z"
      fill="#FFFFFF"
      stroke="#D97706"
      stroke-width="2.2"
      stroke-linejoin="round"
    />
    <path d="M86 174V216" stroke="#065F46" stroke-width="2" />
  </g>

  <!-- Center Foreground Rehal & Radiant Mushaf Emblem -->
  <g transform="translate(225, 488)">
    <!-- Rehal stand -->
    <path d="M35 88L95 46L155 88" stroke="#064E3B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M55 44L95 66L135 44" stroke="#D97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Radiant Mushaf -->
    <path
      d="M44 20L95 36L146 20V58L95 72L44 58V20Z"
      fill="#FFFFFF"
      stroke="#065F46"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <path d="M95 36V72" stroke="#D97706" stroke-width="2.5" />
    <path d="M56 34L84 42M56 46L84 54M134 34L106 42M134 46L106 54" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Bottom Caption Ribbon -->
  <rect x="164" y="592" width="312" height="44" rx="22" fill="#064E3B" stroke="#F59E0B" stroke-width="2" />
  <text
    x="320"
    y="619"
    text-anchor="middle"
    fill="#FEF3C7"
    font-family="'Plus Jakarta Sans', Arial, sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="0.8"
  >
    WISUDA TAHFIDZ • YPI AL-FUAD 1990
  </text>
</svg>
